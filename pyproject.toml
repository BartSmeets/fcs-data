[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcs-data"
version = "0.1.0"
description = "Package for reading and processing FCS data."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Bart J. B. Smeets", email = "bart.smeets.qsp@kuleuven.be"}
]

dependencies = [
    "numpy>=2.0",
    "scipy",
    "lmfit",
    "pybaselines",
]

[project.optional-dependencies]
# Extra dependencies for the FCS Studio app: pip install -e ".[studio]"
studio = [
    "streamlit",
    "plotly",
    "pandas",
    "toml",
]

[project.urls]
Repository = "https://github.com/BartSmeets/fcs-data"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]